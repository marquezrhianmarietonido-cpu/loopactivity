<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Loops</title>
    </head>
    <body>

        <h1>JavaScript Loops</h1>
        <h2>1. While Loop</h2>

        <script>
            let i= 0;

            while (i <=10) {
                document.write(i)
                i++;
            }
        </script>

        <h2>2. For Loops</h2>

        <script>
            for (let i= 1; i<= 5; i++) {
                document.write("HELLO WORLD<br>");
            }
        </script>

        <h2>3. For Loops</h2>

        <script>
            for (let i= 0; i <= 8; i+= 2) {
                document.write(i);
            }
        </script>

        <h2>4. For Loop</h2>
        
        <script>
            for (let i= 1; i<=7; i++) {
                if (i % 2 === 0) {
                    document.write(i + " = EVEN<br>");
                } else {
                    document.write(i + " = ODD<br>");
                }
            } 
        </script>

    </body>
</html>
